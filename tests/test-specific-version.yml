name: Test specific versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmakeVersion: 3.25.2
          ninjaVersion: 1.11.1
          useCloudCache: false
      - name: Assert exact versions on PATH
        env:
          CMAKE_PATH: ${{ steps.action.outputs.cmake-path }}
          NINJA_PATH: ${{ steps.action.outputs.ninja-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$CMAKE_PATH" ] || [ -z "$NINJA_PATH" ]; then
            echo "FAIL: outputs empty"
            exit 1
          fi
          CV="$(cmake --version | head -n1)"
          NV="$(ninja --version)"
          echo "cmake: $CV"
          echo "ninja: $NV"
          if ! echo "$CV" | grep -q "3\.25\.2"; then
            echo "FAIL: expected cmake 3.25.2"
            exit 1
          fi
          if [ "$NV" != "1.11.1" ]; then
            echo "FAIL: expected ninja 1.11.1"
            exit 1
          fi
          echo "PASS"
