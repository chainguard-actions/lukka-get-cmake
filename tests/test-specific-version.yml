name: Test specific cmake and ninja versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare runner temp dirs
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache
      - id: action
        uses: .
        with:
          cmakeVersion: 3.25.2
          ninjaVersion: 1.11.1
          useCloudCache: false
          useLocalCache: false
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.action.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set"
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.action.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set"
      - name: Assert cmake version is 3.25.2
        run: |
          VERSION=$(cmake --version | head -1 | awk '{print $3}')
          echo "cmake version: $VERSION"
          if [ "$VERSION" != "3.25.2" ]; then
            echo "FAIL: expected cmake version 3.25.2 but got $VERSION"
            exit 1
          fi
          echo "PASS: cmake version is 3.25.2"
      - name: Assert ninja version is 1.11.1
        run: |
          VERSION=$(ninja --version)
          echo "ninja version: $VERSION"
          if [ "$VERSION" != "1.11.1" ]; then
            echo "FAIL: expected ninja version 1.11.1 but got $VERSION"
            exit 1
          fi
          echo "PASS: ninja version is 1.11.1"
