name: Test specific cmake and ninja versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-cmake
        uses: .
        with:
          cmakeVersion: "4.2.3"
          ninjaVersion: "1.13.2"
          useCloudCache: false
          useLocalCache: false
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set"
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set"
      - name: Assert cmake version is 4.2.3
        run: |
          VERSION_OUTPUT=$(cmake --version)
          echo "cmake version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "4.2.3"; then
            echo "FAIL: expected cmake version 4.2.3, got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: cmake version is 4.2.3"
      - name: Assert ninja version is 1.13.2
        run: |
          VERSION_OUTPUT=$(ninja --version)
          echo "ninja version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "1.13.2"; then
            echo "FAIL: expected ninja version 1.13.2, got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: ninja version is 1.13.2"
