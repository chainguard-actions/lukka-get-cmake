name: Test specific cmake and ninja versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare runner temp dirs
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache
      - id: get-cmake
        uses: .
        with:
          cmakeVersion: '3.25.2'
          ninjaVersion: '1.11.1'
          useCloudCache: false
          useLocalCache: false
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set"
      - name: Assert cmake version is correct
        run: |
          VERSION_OUTPUT=$(cmake --version)
          echo "cmake version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "3.25.2"; then
            echo "FAIL: expected cmake version 3.25.2 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: cmake version is 3.25.2"
      - name: Assert ninja version is correct
        run: |
          VERSION_OUTPUT=$(ninja --version)
          echo "ninja version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "1.11.1"; then
            echo "FAIL: expected ninja version 1.11.1 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: ninja version is 1.11.1"
