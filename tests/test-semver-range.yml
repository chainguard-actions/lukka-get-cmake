name: Test semver range syntax for cmake version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-cmake
        uses: .
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "~1.11.0"
          useCloudCache: false
          useLocalCache: false
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set"
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set"
      - name: Assert cmake version is in 3.25.x range
        run: |
          VERSION=$(cmake --version | head -1)
          echo "cmake version output: $VERSION"
          if ! echo "$VERSION" | grep -qE "3\.25\.[0-9]+"; then
            echo "FAIL: expected cmake version in 3.25.x range, got: $VERSION"
            exit 1
          fi
          echo "PASS: cmake version is in 3.25.x range"
      - name: Assert ninja version is in 1.11.x range
        run: |
          VERSION=$(ninja --version)
          echo "ninja version output: $VERSION"
          if ! echo "$VERSION" | grep -qE "1\.11\.[0-9]+"; then
            echo "FAIL: expected ninja version in 1.11.x range, got: $VERSION"
            exit 1
          fi
          echo "PASS: ninja version is in 1.11.x range"
