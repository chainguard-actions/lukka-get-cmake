name: Test semver range versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmakeVersion: "~3.28.0"
          ninjaVersion: "~1.11.0"
          useCloudCache: false
      - name: Assert versions match range
        run: |
          C="$(cmake --version | head -1)"
          N="$(ninja --version)"
          echo "cmake: $C"
          echo "ninja: $N"
          if ! echo "$C" | grep -qE 'version 3\.28\.[0-9]+'; then
            echo "FAIL: expected cmake 3.28.x"
            exit 1
          fi
          if ! echo "$N" | grep -qE '^1\.11\.[0-9]+'; then
            echo "FAIL: expected ninja 1.11.x"
            exit 1
          fi
          echo "PASS"
