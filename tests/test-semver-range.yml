name: Test semver range version syntax
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-cmake
        uses: .
        with:
          cmakeVersion: "~3.25.0"
          ninjaVersion: "~1.11.0"
          useCloudCache: false
          useLocalCache: false
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set"
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set"
      - name: Assert cmake version is in 3.25.x range
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path dir: $CMAKE_PATH"
          CMAKE_BIN="$CMAKE_PATH/cmake"
          VERSION_OUTPUT=$("$CMAKE_BIN" --version 2>&1 | head -1)
          echo "cmake version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -qE "3\.25\.[0-9]+"; then
            echo "FAIL: expected cmake version in 3.25.x range, got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: cmake version is in 3.25.x range"
      - name: Assert ninja version is in 1.11.x range
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path dir: $NINJA_PATH"
          NINJA_BIN="$NINJA_PATH/ninja"
          VERSION_OUTPUT=$("$NINJA_BIN" --version 2>&1)
          echo "ninja version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -qE "1\.11\.[0-9]+"; then
            echo "FAIL: expected ninja version in 1.11.x range, got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: ninja version is in 1.11.x range"
      - name: Assert cmake is on PATH
        run: |
          which cmake || (echo "FAIL: cmake not found on PATH" && exit 1)
          cmake --version
          echo "PASS: cmake is on PATH"
      - name: Assert ninja is on PATH
        run: |
          which ninja || (echo "FAIL: ninja not found on PATH" && exit 1)
          ninja --version
          echo "PASS: ninja is on PATH"
