name: Test semver range version syntax
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-cmake
        uses: .
        with:
          cmakeVersion: "~4.2.0"
          ninjaVersion: "~1.13.0"
          useCloudCache: false
          useLocalCache: false
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set"
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set"
      - name: Assert cmake version is in 4.2.x range
        run: |
          VERSION_OUTPUT=$(cmake --version)
          echo "cmake version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -qE "4\.2\.[0-9]+"; then
            echo "FAIL: expected cmake version in 4.2.x range, got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: cmake version is in 4.2.x range"
      - name: Assert ninja version is in 1.13.x range
        run: |
          VERSION_OUTPUT=$(ninja --version)
          echo "ninja version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -qE "1\.13\.[0-9]+"; then
            echo "FAIL: expected ninja version in 1.13.x range, got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: ninja version is in 1.13.x range"
