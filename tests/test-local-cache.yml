name: Test local cache usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare runner temp dirs
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache
      - id: get-cmake
        uses: .
        with:
          cmakeVersion: '3.26.4'
          ninjaVersion: '1.11.1'
          useCloudCache: false
          useLocalCache: true
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set"
      - name: Assert cmake executable works
        run: |
          echo "Testing cmake from PATH"
          cmake --version
          echo "PASS: cmake executable works"
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set"
      - name: Assert ninja executable works
        run: |
          echo "Testing ninja from PATH"
          ninja --version
          echo "PASS: ninja executable works"
      - name: Run action again to test local cache hit
        id: get-cmake-cached
        uses: .
        with:
          cmakeVersion: '3.26.4'
          ninjaVersion: '1.11.1'
          useCloudCache: false
          useLocalCache: true
      - name: Assert cmake-path from cache is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake-cached.outputs.cmake-path }}
        run: |
          echo "cmake-path (cached): $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty after cache hit"
            exit 1
          fi
          echo "PASS: cmake-path is set after cache hit"
      - name: Assert cmake works after cache hit
        run: |
          cmake --version
          echo "PASS: cmake works after cache hit"
