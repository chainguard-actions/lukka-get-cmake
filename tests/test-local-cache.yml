name: Test local cache usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-cmake
        uses: .
        with:
          cmakeVersion: 3.26.4
          ninjaVersion: 1.11.1
          useCloudCache: false
          useLocalCache: true
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set"
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set"
      - name: Assert cmake is functional
        run: |
          echo "Running cmake from PATH"
          cmake --version
          if [ $? -ne 0 ]; then
            echo "FAIL: cmake --version failed"
            exit 1
          fi
          echo "PASS: cmake is executable"
      - name: Assert ninja is functional
        run: |
          echo "Running ninja from PATH"
          ninja --version
          if [ $? -ne 0 ]; then
            echo "FAIL: ninja --version failed"
            exit 1
          fi
          echo "PASS: ninja is executable"
      - name: Run action again to exercise local cache hit
        id: get-cmake-cached
        uses: .
        with:
          cmakeVersion: 3.26.4
          ninjaVersion: 1.11.1
          useCloudCache: false
          useLocalCache: true
      - name: Assert cmake-path is still set after cache hit
        env:
          CMAKE_PATH: ${{ steps.get-cmake-cached.outputs.cmake-path }}
        run: |
          echo "cmake-path (cached): $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty after cache hit"
            exit 1
          fi
          echo "PASS: cmake-path is set after cache hit"
      - name: Assert cmake still works after cache hit
        run: |
          echo "Running cmake from PATH after cache hit"
          cmake --version
          if [ $? -ne 0 ]; then
            echo "FAIL: cmake --version failed after cache hit"
            exit 1
          fi
          echo "PASS: cmake is executable after cache hit"
