name: Test specific CMake and Ninja versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmakeVersion: "3.25.2"
          ninjaVersion: "1.11.1"
          useCloudCache: false
          useLocalCache: false
      - name: Assert cmake version
        run: |
          which cmake
          OUT="$(cmake --version)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "3.25.2"; then
            echo "FAIL: expected cmake 3.25.2"
            exit 1
          fi
          echo "PASS"
      - name: Assert ninja version
        run: |
          which ninja
          OUT="$(ninja --version)"
          echo "$OUT"
          if [ "$OUT" != "1.11.1" ]; then
            echo "FAIL: expected ninja 1.11.1"
            exit 1
          fi
          echo "PASS"
      - name: Assert outputs
        env:
          CMAKE_PATH: ${{ steps.action.outputs.cmake-path }}
          NINJA_PATH: ${{ steps.action.outputs.ninja-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$CMAKE_PATH" ] || [ ! -e "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path empty or missing"
            exit 1
          fi
          if [ -z "$NINJA_PATH" ] || [ ! -e "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path empty or missing"
            exit 1
          fi
          echo "PASS"
