name: Test default (latest) versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          useCloudCache: false
      - name: Assert cmake and ninja work
        env:
          CMAKE_PATH: ${{ steps.action.outputs.cmake-path }}
          NINJA_PATH: ${{ steps.action.outputs.ninja-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          echo "ninja-path: $NINJA_PATH"
          cmake --version || { echo "FAIL: cmake not runnable"; exit 1; }
          ninja --version || { echo "FAIL: ninja not runnable"; exit 1; }
          MAJOR="$(cmake --version | head -1 | sed -E 's/.*version ([0-9]+)\..*/\1/')"
          echo "major: $MAJOR"
          if [ "$MAJOR" -lt 3 ]; then
            echo "FAIL: expected cmake >= 3"
            exit 1
          fi
          if [ -z "$CMAKE_PATH" ] || [ -z "$NINJA_PATH" ]; then
            echo "FAIL: outputs empty"
            exit 1
          fi
          echo "PASS"
