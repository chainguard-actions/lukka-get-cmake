name: Test specific cmake and ninja versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-cmake
        uses: .
        with:
          cmakeVersion: "3.26.4"
          ninjaVersion: "1.11.1"
          useCloudCache: false
          useLocalCache: false
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set"
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set"
      - name: Assert cmake version is 3.26.4
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          CMAKE_EXE="$CMAKE_PATH/cmake"
          VERSION=$("$CMAKE_EXE" --version | head -1 | awk '{print $3}')
          echo "Installed cmake version: $VERSION"
          if [ "$VERSION" != "3.26.4" ]; then
            echo "FAIL: expected cmake version 3.26.4, got $VERSION"
            exit 1
          fi
          echo "PASS: cmake version is 3.26.4"
      - name: Assert ninja version is 1.11.1
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          NINJA_EXE="$NINJA_PATH/ninja"
          VERSION=$("$NINJA_EXE" --version)
          echo "Installed ninja version: $VERSION"
          if [ "$VERSION" != "1.11.1" ]; then
            echo "FAIL: expected ninja version 1.11.1, got $VERSION"
            exit 1
          fi
          echo "PASS: ninja version is 1.11.1"
