name: Test basic usage (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          useCloudCache: false
      - name: Assert cmake and ninja installed
        env:
          CMAKE_PATH: ${{ steps.action.outputs.cmake-path }}
          NINJA_PATH: ${{ steps.action.outputs.ninja-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$CMAKE_PATH" ] || [ ! -e "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output missing or does not exist"
            exit 1
          fi
          if [ -z "$NINJA_PATH" ] || [ ! -e "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output missing or does not exist"
            exit 1
          fi
          which cmake
          which ninja
          cmake --version || { echo "FAIL: cmake not runnable"; exit 1; }
          ninja --version || { echo "FAIL: ninja not runnable"; exit 1; }
          echo "PASS"
