name: Test basic usage - latest cmake and ninja
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-cmake
        uses: .
        with:
          useCloudCache: false
          useLocalCache: false
      - name: Assert cmake-path output is set
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path: $CMAKE_PATH"
          if [ -z "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path output is empty"
            exit 1
          fi
          echo "PASS: cmake-path is set to $CMAKE_PATH"
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set to $NINJA_PATH"
      - name: Assert cmake is on PATH and functional
        run: |
          echo "Checking cmake on PATH..."
          which cmake || { echo "FAIL: cmake not found on PATH"; exit 1; }
          cmake --version
          echo "PASS: cmake is functional"
      - name: Assert ninja is on PATH and functional
        run: |
          echo "Checking ninja on PATH..."
          which ninja || { echo "FAIL: ninja not found on PATH"; exit 1; }
          ninja --version
          echo "PASS: ninja is functional"
      - name: Assert cmake binary exists in cmake-path directory
        env:
          CMAKE_PATH: ${{ steps.get-cmake.outputs.cmake-path }}
        run: |
          echo "cmake-path directory: $CMAKE_PATH"
          if [ ! -d "$CMAKE_PATH" ]; then
            echo "FAIL: cmake-path is not a directory"
            exit 1
          fi
          if [ ! -f "$CMAKE_PATH/cmake" ]; then
            echo "FAIL: cmake binary not found in $CMAKE_PATH"
            ls -la "$CMAKE_PATH" || true
            exit 1
          fi
          "$CMAKE_PATH/cmake" --version
          echo "PASS: cmake binary found and functional in cmake-path directory"
      - name: Assert ninja binary exists in ninja-path directory
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path directory: $NINJA_PATH"
          if [ ! -d "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path is not a directory"
            exit 1
          fi
          if [ ! -f "$NINJA_PATH/ninja" ]; then
            echo "FAIL: ninja binary not found in $NINJA_PATH"
            ls -la "$NINJA_PATH" || true
            exit 1
          fi
          "$NINJA_PATH/ninja" --version
          echo "PASS: ninja binary found and functional in ninja-path directory"
