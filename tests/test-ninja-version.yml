name: Test specific ninjaVersion input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-cmake
        uses: .
        with:
          ninjaVersion: "1.11.1"
          useCloudCache: false
          useLocalCache: false
      - name: Assert ninja-path output is set
        env:
          NINJA_PATH: ${{ steps.get-cmake.outputs.ninja-path }}
        run: |
          echo "ninja-path: $NINJA_PATH"
          if [ -z "$NINJA_PATH" ]; then
            echo "FAIL: ninja-path output is empty"
            exit 1
          fi
          echo "PASS: ninja-path is set to $NINJA_PATH"
      - name: Assert ninja version is 1.11.1
        run: |
          VERSION=$(ninja --version)
          echo "ninja version: $VERSION"
          if [ "$VERSION" != "1.11.1" ]; then
            echo "FAIL: expected ninja version 1.11.1, got $VERSION"
            exit 1
          fi
          echo "PASS: ninja version is $VERSION"
